name: Ensure worker deploy not superseded
description: Skip a push deploy only when prod has newer commits that touch this worker's deploy paths
inputs:
  event-name:
    description: github.event_name for the workflow run
    required: true
  filters:
    description: dorny/paths-filter YAML with a single superseding filter key
    required: true
runs:
  using: composite
  steps:
    - name: Decide whether to compare against prod
      id: prep
      shell: bash
      run: |
        if [ "${{ inputs.event-name }}" != "push" ]; then
          echo "range_check=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git fetch origin prod
        tip="$(git rev-parse origin/prod)"
        if [ "${GITHUB_SHA}" = "${tip}" ]; then
          echo "range_check=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "range_check=true" >> "$GITHUB_OUTPUT"

    - name: Detect superseding worker changes on prod
      if: steps.prep.outputs.range_check == 'true'
      id: paths
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        base: ${{ github.sha }}
        ref: origin/prod
        filters: ${{ inputs.filters }}

    - name: Abort deploy when a newer worker deploy should win
      if: steps.prep.outputs.range_check == 'true'
      shell: bash
      run: |
        if [ "${{ steps.paths.outputs.superseding }}" = "true" ]; then
          echo "::notice title=Deploy skipped::A newer commit on prod changes this worker; that workflow run should deploy instead."
          exit 1
        fi

        echo "No superseding changes for this worker between ${GITHUB_SHA} and prod; continuing deploy."
