name: Ensure deploy not superseded
description: Skip a push deploy when prod has moved past this commit; the newer push deploys instead
inputs:
  event-name:
    description: github.event_name for the workflow run
    required: true
runs:
  using: composite
  steps:
    - name: Abort deploy when prod has a newer commit
      shell: bash
      run: |
        if [ "${{ inputs.event-name }}" != "push" ]; then
          exit 0
        fi

        git fetch origin prod
        tip="$(git rev-parse origin/prod)"
        if [ "${GITHUB_SHA}" != "${tip}" ]; then
          echo "::notice title=Deploy skipped::prod has moved to ${tip}; that workflow run deploys instead."
          exit 1
        fi
