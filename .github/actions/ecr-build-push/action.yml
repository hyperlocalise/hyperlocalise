# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: ECR build push
description: Build a container image and push it to ECR
inputs:
  registry:
    description: ECR registry URI
    required: true
  repository:
    description: ECR repository name
    required: true
  tag:
    description: Image tag (without registry/repository prefix)
    required: true
  context:
    description: Docker build context
    default: .
  dockerfile:
    description: Path to the Dockerfile
    default: apps/go-svc/Dockerfile.ecs
  platforms:
    description: Target platforms
    default: linux/amd64
outputs:
  image:
    description: Fully-qualified image URI that was pushed
    value: ${{ steps.image.outputs.image }}
runs:
  using: composite
  steps:
    - name: Resolve image URI
      id: image
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        echo "image=${REGISTRY}/${REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Build and push image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.image.outputs.image }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
