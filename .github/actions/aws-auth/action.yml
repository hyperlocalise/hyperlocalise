# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: AWS auth
description: Configure AWS credentials via OIDC and log in to Amazon ECR
inputs:
  role-to-assume:
    description: AWS IAM role ARN to assume
    required: true
  aws-region:
    description: AWS region
    required: true
  role-session-name:
    description: Role session name for the assumed role
    default: github-actions-deploy
outputs:
  registry:
    description: ECR registry URI from amazon-ecr-login
    value: ${{ steps.ecr.outputs.registry }}
runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: ${{ inputs.role-session-name }}

    - name: Log in to Amazon ECR
      id: ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
