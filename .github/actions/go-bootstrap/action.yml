# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Go bootstrap
description: Setup Go toolchain and restore module cache
inputs:
  go-version-file:
    description: Path to the go.mod file
    default: go.mod
runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: true
    - name: Download modules
      run: go mod download
      shell: bash
