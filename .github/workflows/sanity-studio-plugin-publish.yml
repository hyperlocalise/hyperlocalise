name: Sanity Studio Plugin Publish

on:
  push:
    tags:
      - "sanity-studio-plugin-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish with --dry-run"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: sanity-studio-plugin-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish sanity-plugin-hyperlocalise
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: apps/sanity-studio-plugin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24.22.1"
          working-directory: apps/sanity-studio-plugin
          cache: true
          run-install: false

      - name: Install sanity-studio-plugin dependencies
        run: vp install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/sanity-studio-plugin-v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#sanity-studio-plugin-v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag sanity-studio-plugin-v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Check sanity-studio-plugin
        run: vp check

      - name: Build sanity-studio-plugin
        run: pnpm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if echo "$VERSION" | grep -Eq '-(alpha|beta|rc)'; then
            EXTRA+=(--tag next)
          fi
          npm publish --provenance --access public "${EXTRA[@]}"
