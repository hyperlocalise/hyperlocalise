name: Public API Image CI

on:
    # Manual runs build the image without pushing and can write the shared GHA
    # layer cache. Pull requests do not trigger this workflow.
    # Do not add push-to-main; production images are built by public-api-deploy.yml.
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: public-api-build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build public-api ECS image
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - name: Build public-api ECS image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  file: ./apps/public-api/Dockerfile
                  platforms: linux/amd64
                  push: false
                  tags: hyperlocalise/public-api:dispatch-${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
