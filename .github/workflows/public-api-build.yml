name: Public API Image CI

on:
    # Manual runs build the image without pushing and can write the shared GHA
    # layer cache. Pull requests do not trigger this workflow.
    # Do not add push-to-main; production images are built by public-api-deploy.yml.
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: public-api-build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build public-api ECS image
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Build public-api ECS image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: ./apps/public-api/Dockerfile
                  platforms: linux/amd64
                  push: false
                  tags: hyperlocalise/public-api:dispatch-${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
