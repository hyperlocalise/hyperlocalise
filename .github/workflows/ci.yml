name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - apps/hyperlocalise-web/**
      - "!apps/hyperlocalise-web/drizzle/**"
      - .github/workflows/web.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap Go toolchain
        uses: ./.github/actions/go-bootstrap
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          make fmt
          git diff --exit-code

      # Keep version in sync with Makefile golangci_lint_version.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: ./...

  action-self-test:
    name: Action Self Test
    if: github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Hyperlocalise action
        id: hyperlocalise
        uses: ./
        with:
          check: check
          config-path: i18n.yml
          fail-on-findings: false
          upload-artifact: false

      - name: Verify action outputs
        shell: bash
        env:
          CLI_EXIT_CODE: ${{ steps.hyperlocalise.outputs.cli-exit-code }}
          FINDINGS_DETECTED: ${{ steps.hyperlocalise.outputs.findings-detected }}
          FINDINGS_TOTAL: ${{ steps.hyperlocalise.outputs.findings-total }}
          ERROR_COUNT: ${{ steps.hyperlocalise.outputs.error-count }}
          WARNING_COUNT: ${{ steps.hyperlocalise.outputs.warning-count }}
        run: |
          set -euo pipefail
          test "${CLI_EXIT_CODE}" = "0"
          case "${FINDINGS_DETECTED}" in
            true|false) ;;
            *)
              echo "Unexpected findings-detected output: ${FINDINGS_DETECTED}" >&2
              exit 1
              ;;
          esac
          [[ "${FINDINGS_TOTAL}" =~ ^[0-9]+$ ]]
          [[ "${ERROR_COUNT}" =~ ^[0-9]+$ ]]
          [[ "${WARNING_COUNT}" =~ ^[0-9]+$ ]]

  web-sync-cli-smoke-test:
    name: Web Sync CLI Smoke Test
    if: github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: apps/hyperlocalise-web
    env:
      HYPERLOCALISE_API_KEY: hl_sync_self_test
      HYPERLOCALISE_PROJECT_ID: project_sync_self_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Hyperlocalise
        uses: ./install
        with:
          version: 1.12.1

      - name: Dry-run sync push
        run: hl sync push --dry-run

      - name: Dry-run sync pull
        run: hl sync pull --dry-run

      - name: Pack locale catalogs
        run: hl pack

  bazel-build-test:
    name: Bazel Build/Test
    if: github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

      # Blacksmith injects --remote_cache when Bazel Build Caching is enabled.
      # Do not set an explicit --remote_cache here; it would take precedence.
      - name: Bazel build
        run: bazel build --config=ci //:cli

      - name: Bazel test
        run: bazel test --config=ci //apps/cli/cmd:cmd_test

  go-test:
    name: Go Test/Build
    if: github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hyperlocalise
          POSTGRES_USER: hyperlocalise
          POSTGRES_PASSWORD: hyperlocalise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hyperlocalise -d hyperlocalise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://hyperlocalise:hyperlocalise@127.0.0.1:5432/hyperlocalise?sslmode=disable
      VALKEY_URL: redis://127.0.0.1:6379
      GO_SVC_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          working-directory: apps/hyperlocalise-web
          cache: true
          run-install: false

      - name: Install hyperlocalise-web dependencies
        working-directory: apps/hyperlocalise-web
        run: vp install --frozen-lockfile

      - name: Migrate hyperlocalise-web database
        working-directory: apps/hyperlocalise-web
        run: vp run db:migrate

      - name: Bootstrap Go toolchain
        uses: ./.github/actions/go-bootstrap
        with:
          go-version-file: go.mod

      - name: Workspace tests
        run: make test-workspace

      - name: Check builds
        run: make check-build
