name: Go Service Image CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .dockerignore
      - go.mod
      - go.sum
      - orchestrion.tool.go
      - third_party/**
      - internal/**
      - apps/go-svc/**
      - .github/actions/ecr-build-push/**
      - .github/workflows/go-svc-build.yml
      - .github/workflows/go-svc-deploy.yml

permissions:
  contents: read

concurrency:
  group: go-svc-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build go-svc ECS image
    if: github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build go-svc ECS image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./apps/go-svc/Dockerfile.ecs
          platforms: linux/amd64
          push: false
          tags: hyperlocalise/go-svc:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
