name: Go Service Image CI

on:
    # Pull requests skip the image build. workflow_dispatch still builds
    # without pushing and can write the shared GHA layer cache.
    # Do not add push-to-main; production images are built by go-svc-deploy.yml.
    workflow_dispatch:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - .dockerignore
            - go.mod
            - go.sum
            - orchestrion.tool.go
            - third_party/**
            - internal/**
            - apps/go-svc/**
            - .github/actions/ecr-build-push/**
            - .github/workflows/go-svc-build.yml
            - .github/workflows/go-svc-deploy.yml

permissions:
    contents: read

concurrency:
    group: go-svc-build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build go-svc ECS image
        # Skip on pull requests. go-svc-deploy.yml builds and pushes the image
        # when prod changes. workflow_dispatch remains available for a local build.
        if: github.event_name == 'workflow_dispatch'
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            - name: Build go-svc ECS image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  file: ./apps/go-svc/Dockerfile.ecs
                  platforms: linux/amd64
                  push: false
                  tags: hyperlocalise/go-svc:${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('dispatch-{0}', github.sha) }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
