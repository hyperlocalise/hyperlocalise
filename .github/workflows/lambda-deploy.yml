          VERSION_ID: ${{ steps.deploy.outputs.version-id }}
          FUNCTION_NAME: ${{ steps.deploy.outputs.function-name }}
          UPDATE: ${{ steps.deploy.outputs.update }}
        run: |
          {
            echo "## Memory-interchange Lambda deployed"
            echo
            echo "- Function: \`${FUNCTION_NAME}\`"
            echo "- Object: \`${S3_URI}\`"
            echo "- Version: \`${VERSION_ID}\`"
            echo "- Update: \`${UPDATE}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  visual_context_match_deploy:
    name: Build and deploy visual-context-match Lambda
    if: github.ref == 'refs/heads/prod'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    concurrency:
      group: lambda-deploy-visual-context-match-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Ensure push deploy is not superseded
        uses: ./.github/actions/ensure-deploy-main-tip
        with:
          event-name: ${{ github.event_name }}

      - name: Bootstrap Go toolchain
        uses: ./.github/actions/go-bootstrap
        with:
          go-version-file: go.mod

      - name: Test visual-context-match Lambda
        run: go test ./apps/visual-context-match-lambda ./internal/objectstore/...

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-lambda-deploy

      - name: Build and deploy visual-context-match Lambda artifact
        id: deploy
        uses: ./.github/actions/deploy-lambda-artifact
