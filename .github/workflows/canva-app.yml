name: Canva App CI

on:
  # Manual runs on main write shared caches that PRs can restore.
  # Do not add push-to-main; that would run CI on every merge.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/canva-app/**
      - .github/workflows/canva-app.yml

permissions:
  contents: read

concurrency:
  group: canva-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  canva-check:
    name: Canva App Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: apps/canva-app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          working-directory: apps/canva-app
          cache: true
          # setup-vp defaults to `vp install` at the repo root, which has no
          # package.json. The next step installs in apps/canva-app.
          run-install: false

      - name: Install canva-app dependencies
        run: vp install --frozen-lockfile

      - name: Check canva-app
        run: vp check

  # Draft PRs run tests related to the PR diff and skip the production bundle.
  # Ready PRs and workflow_dispatch run the full suite and bundle.
  canva-test-build:
    name: Canva App Test/Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: apps/canva-app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch PR base for changed tests
        if: github.event.pull_request.draft
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        working-directory: ${{ github.workspace }}
        run: git fetch --no-tags --depth=1 origin "${BASE_SHA}"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          working-directory: apps/canva-app
          cache: true
          # setup-vp defaults to `vp install` at the repo root, which has no
          # package.json. The next step installs in apps/canva-app.
          run-install: false

      - name: Install canva-app dependencies
        run: vp install --frozen-lockfile

      - name: Cache Vitest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/canva-app/.cache/vitest
            apps/canva-app/.cache/vite
          key: ${{ runner.os }}-canva-vitest-${{ hashFiles('apps/canva-app/pnpm-lock.yaml', 'apps/canva-app/vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-canva-vitest-${{ hashFiles('apps/canva-app/pnpm-lock.yaml', 'apps/canva-app/vite.config.ts') }}-
            ${{ runner.os }}-canva-vitest-

      - name: Test canva-app
        env:
          # Only draft PRs get a SHA here. Ready PRs and workflow_dispatch stay full.
          VITEST_CHANGED_SINCE: ${{ github.event.pull_request.draft && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "${VITEST_CHANGED_SINCE}" ]; then
            echo "Draft PR: running tests related to changes since ${VITEST_CHANGED_SINCE}"
            vp test --changed "${VITEST_CHANGED_SINCE}" --passWithNoTests
          else
            vp test
          fi

      - name: Bundle canva-app
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        env:
          CANVA_BACKEND_HOST: https://app.example.test
        run: vp run bundle
