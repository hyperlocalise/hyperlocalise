name: Go Service Deploy

on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - Dockerfile.vercel
      - go.mod
      - go.sum
      - third_party/**
      - internal/**
      - apps/go-svc/**
      - .github/workflows/go-svc-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-svc-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  ECR_REPOSITORY_PARAMETER_NAME: /hyperlocalise/prod/ecr/go-svc/repository_name

jobs:
  build-and-deploy:
    name: Build and deploy go-svc
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate AWS configuration
        run: |
          set -euo pipefail
          missing=()
          [ -n "${AWS_REGION:-}" ] || missing+=("vars.AWS_REGION")
          [ -n "${AWS_DEPLOY_ROLE_ARN:-}" ] || missing+=("vars.AWS_DEPLOY_ROLE_ARN")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub configuration: ${missing[*]}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-go-svc-deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Read ECR repository from Parameter Store
        uses: eliasjcjunior/aws-ssm-parameters-action@v1.2.2
        with:
          paths: ${{ env.ECR_REPOSITORY_PARAMETER_NAME }}
          split-env: true
          upper-case: true

      - name: Compute image reference and log in to ECR
        id: image
        env:
          ECR_REPOSITORY: ${{ env.REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image="${registry}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${registry}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.vercel
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
