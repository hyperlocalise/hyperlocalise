name: Go Service Deploy

on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - Dockerfile.vercel
      - go.mod
      - go.sum
      - third_party/**
      - internal/**
      - apps/go-svc/**
      - .github/workflows/go-svc-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: go-svc-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  ECR_REPOSITORY_PARAMETER_NAME: /hyperlocalise/prod/ecr/go-svc/repository_name
  ECS_CLUSTER_PARAMETER_NAME: /hyperlocalise/prod/ecs/go-svc/cluster_name
  ECS_SERVICE_PARAMETER_NAME: /hyperlocalise/prod/ecs/go-svc/service_name

jobs:
  build-and-deploy:
    name: Build and deploy go-svc
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate configuration
        run: |
          set -u
          : "${AWS_REGION:?vars.AWS_REGION is required}"
          : "${AWS_DEPLOY_ROLE_ARN:?vars.AWS_DEPLOY_ROLE_ARN is required}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-go-svc-deploy

      - name: Read deployment parameters
        run: |
          set -euo pipefail
          response=$(aws ssm get-parameters \
            --names "${ECR_REPOSITORY_PARAMETER_NAME}" \
                    "${ECS_CLUSTER_PARAMETER_NAME}" \
                    "${ECS_SERVICE_PARAMETER_NAME}" \
            --output json)
          invalid=$(echo "${response}" | jq -r '.InvalidParameters[]?')
          if [ -n "${invalid}" ]; then
            echo "::error::Missing SSM parameters: ${invalid}"
            exit 1
          fi
          value_of() {
            echo "${response}" | jq -r --arg name "$1" \
              '.Parameters[] | select(.Name == $name) | .Value // empty'
          }
          ECR_REPOSITORY=$(value_of "${ECR_REPOSITORY_PARAMETER_NAME}")
          ECS_CLUSTER=$(value_of "${ECS_CLUSTER_PARAMETER_NAME}")
          ECS_SERVICE=$(value_of "${ECS_SERVICE_PARAMETER_NAME}")
          for var in ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE; do
            if [ -z "${!var:-}" ] || [ "${!var}" = "None" ]; then
              echo "::error::SSM parameter missing or empty for ${var}"
              exit 1
            fi
          done
          {
            echo "ECR_REPOSITORY=${ECR_REPOSITORY}"
            echo "ECS_CLUSTER=${ECS_CLUSTER}"
            echo "ECS_SERVICE=${ECS_SERVICE}"
          } >> "${GITHUB_ENV}"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.vercel
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fetches the live task definition by family, swaps only the image to the
      # newly pushed tag, then registers and deploys it. No checked-in file,
      # no AWS CLI. Convention: family and container share the service name.
      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.ECS_SERVICE }}
          container-name: ${{ env.ECS_SERVICE }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
