# Minimal starter config.
# Read this file top-to-bottom: locales -> buckets -> llm.
# This starter intentionally skips advanced sections like groups, rules, and remote cache config.
# When groups are omitted, Hyperlocalise runs all buckets for all target locales.
# Pin the Hyperlocalise CLI version (like packageManager in package.json).
# version: hyperlocalise@1.12.1
locales:
  # Source locale: the language your original content is written in.
  source: en-US
  # Target locales: one output is generated per locale listed here.
  # Add more locales as your project grows.
  targets:
    - es-ES

# One bucket defines how files map from source to target.
# Use {{source}} and {{target}} placeholders in paths.
buckets:
  # Bucket name is arbitrary; choose a name that matches your domain.
  ui:
    files:
      - # Input path template.
        # Example with source=en-US:
        # packages/ui/lang/en-US.json
        from: packages/ui/lang/{{source}}.json
        # Output path template.
        # Example with target=es-ES:
        # apps/web/lang/es-ES.json
        to: apps/web/lang/{{target}}.json

llm:
  # Profiles define provider/model and optional prompt behavior.
  # A default profile is required.
  # Supported providers: openai, azure_openai, anthropic, gemini, bedrock, lmstudio, groq, mistral, ollama, openrouter, ai_gateway.
  # Available vars: {{source}}, {{target}}, {{input}}.
  profiles:
    default:
      # Provider: openai, azure_openai, anthropic, gemini, bedrock, lmstudio, groq, mistral, ollama, openrouter, or ai_gateway.
      provider: openai
      model: gpt-5.2
      # Optional explicit system message template.
      # system_prompt: You are a senior localization expert.
      # Optional explicit user message template.
      # user_prompt: |-
      #   Translate from {{source}} to {{target}}:
      #
      #   {{input}}
      # Deprecated legacy prompt template (use system_prompt/user_prompt instead).
      # prompt: |-
      #   Translate from {{source}} to {{target}}:
      #
      #   {{input}}

# Machine translation (MT) is available as an alternative or complement to LLM
# translation. Uncomment and adapt the two sections below to route some or all
# groups through Google Cloud Translation or DeepL instead of an LLM profile.
# mt:
#   profiles:
#     google_default:
#       provider: google
#       # You choose this environment variable name yourself; MT profiles do
#       # not read a fixed variable name the way LLM providers do.
#       api_key_env: GOOGLE_TRANSLATE_API_KEY
#     deepl_default:
#       provider: deepl
#       api_key_env: DEEPL_API_KEY
#       # Must be exactly https://api.deepl.com (Pro) or https://api-free.deepl.com (Free).
#       base_url: https://api-free.deepl.com
#
# translation:
#   default:
#     type: llm
#     profile: default
#   rules:
#     - priority: 100
#       group: default
#       type: mt
#       profile: google_default
#
# translation.rules cannot be combined with llm.rules; migrate any llm.rules
# entries into translation.rules before enabling this section.
# MT profiles are only checked and connected to once a translation rule or
# default actually selects them, so adding a profile you are not using yet is safe.
