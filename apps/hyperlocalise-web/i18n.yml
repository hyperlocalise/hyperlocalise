# Hyperlocalise sync config for the web app (react-intl / FormatJS).
version: hyperlocalise@1.13.3
locales:
  source: en-US
  targets:
    - zh-CN
    - da-DK
    - nl-NL
    - fil-PH
    - fr-FR
    - de-DE
    - ja-JP
    - ko-KR
    - th-TH
    - vi-VN

buckets:
  web:
    files:
      - from: lang/en-US.json
        to: lang/{{target}}.json
  blog:
    files:
      - from: _posts/en/**/*.md
        to: _posts/{{target}}/**/*.md

llm:
  profiles:
    default:
      provider: openai
      model: gpt-6-luna

hyperlocalise:
  project_id_env: HYPERLOCALISE_PROJECT_ID
  api_base_url: https://hyperlocalise.com/api
  api_key_env: HYPERLOCALISE_API_KEY
  timeout_seconds: 1200
