      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        sourceText: { type: string }
        context: { type: [string, "null"] }
        type: { type: [string, "null"] }
        maxLength: { type: [integer, "null"] }
        hidden: { type: boolean }
        filePath: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StringResponse:
      type: object
      required: [string]
      properties:
        string: { $ref: "#/components/schemas/String" }
    Translation:
      type: object
      required: [id, stringId, key, locale, text, status, provenance, reviewedByUserId, reviewedAt, createdAt, updatedAt]
